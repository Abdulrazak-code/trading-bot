<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Bot Dashboard</title>
<style>
  body { font-family: monospace; background: #0d0d0d; color: #e0e0e0; padding: 20px; }
  h1 { color: #00cc88; }
  .card { background: #1a1a1a; border: 1px solid #333; padding: 16px; margin: 12px 0; border-radius: 6px; }
  .label { color: #888; font-size: 0.85em; }
  .value { font-size: 1.2em; font-weight: bold; }
  .green { color: #00cc88; }
  .red { color: #ff4455; }
  .gray { color: #888; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th { color: #888; text-align: left; padding: 6px; border-bottom: 1px solid #333; }
  td { padding: 6px; border-bottom: 1px solid #222; vertical-align: top; }
  .reason-cell { max-width: 600px; word-wrap: break-word; white-space: pre-wrap; font-size: 0.8em; color: #ccc; }
  .conf { color: #888; font-size: 0.85em; }
  #status { font-size: 0.8em; color: #555; }
</style>
</head>
<body>
<h1>Trading Bot</h1>
<div id="status">Loading...</div>

<div class="card" id="position-card">
  <div class="label">Open Position</div>
  <div class="value" id="position">—</div>
</div>

<div style="display:flex;gap:12px">
  <div class="card" style="flex:1">
    <div class="label">Available Cash</div>
    <div class="value" id="cash">—</div>
  </div>
  <div class="card" style="flex:1">
    <div class="label">Today's Net P&L</div>
    <div class="value" id="pnl">—</div>
  </div>
  <div class="card" style="flex:1">
    <div class="label">Claude Budget Used</div>
    <div class="value" id="budget">—</div>
  </div>
</div>

<div style="display:flex;gap:12px">
  <div class="card" style="flex:1">
    <div class="label">Today's Profit</div>
    <div class="value green" id="gross-profit">—</div>
    <div class="label" id="win-count"></div>
  </div>
  <div class="card" style="flex:1">
    <div class="label">Today's Loss</div>
    <div class="value red" id="gross-loss">—</div>
    <div class="label" id="loss-count"></div>
  </div>
  <div class="card" style="flex:1">
    <div class="label">Win / Loss</div>
    <div class="value" id="win-loss">—</div>
    <div class="label" id="trade-count"></div>
  </div>
</div>

<div class="card">
  <div class="label">Recent Trades</div>
  <table id="trades-table">
    <thead><tr><th>Time</th><th>Action</th><th>Stock</th><th>Price</th><th>Conf</th><th>Reasoning</th></tr></thead>
    <tbody id="trades-body"></tbody>
  </table>
</div>

<script>
async function refresh() {
  try {
    const [stateRes, tradesRes] = await Promise.all([fetch('/api/state'), fetch('/api/trades')]);
    const state = await stateRes.json();
    const trades = await tradesRes.json();

    const pos = state.position;
    document.getElementById('position').textContent = pos
      ? `${pos.stock} @ ₹${pos.entry_price.toFixed(2)}  qty=${pos.qty}  stop=₹${(pos.stop_price||0).toFixed(2)}  TP=₹${(pos.take_profit_price||0).toFixed(2)}`
      : '—';

    document.getElementById('cash').textContent = state.cash != null ? `₹${state.cash.toFixed(2)}` : '—';

    document.getElementById('budget').textContent =
      `$${(state.claude_spend_usd || 0).toFixed(4)} / $9.00`;

    // Replicate calculate_charges from order_executor.py
    function calcCharges(buyVal, sellVal) {
      const brokerage = Math.min(20, buyVal * 0.001) + Math.min(20, sellVal * 0.001);
      const exchange  = (buyVal + sellVal) * 0.0000325;
      const gst       = (brokerage + exchange) * 0.18;
      const stt       = sellVal * 0.00025;
      const stamp     = buyVal * 0.00003;
      return brokerage + exchange + gst + stt + stamp;
    }

    // Local (IST) date — trade timestamps are written in machine-local time
    const now = new Date();
    const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    // Pair BUY→SELL per stock (FIFO) so interleaved stocks don't cross-pair.
    const openBuys = {};   // stock -> [buy_value, ...]
    let grossProfit = 0, grossLoss = 0, wins = 0, losses = 0, realizedNet = 0, orphanSells = 0;
    trades.filter(t => t.timestamp && t.timestamp.startsWith(today)).forEach(t => {
      const stock = t.coin || t.stock || '?';
      const amount = parseFloat(t.amount_inr || 0);
      if (t.action === 'BUY') {
        (openBuys[stock] = openBuys[stock] || []).push(amount);
      } else if (t.action === 'SELL') {
        const q = openBuys[stock];
        if (q && q.length) {
          const buyVal = q.shift();
          const charges = calcCharges(buyVal, amount);
          const pnl = (amount - buyVal) - charges;
          realizedNet += pnl;
          if (pnl >= 0) { grossProfit += pnl; wins++; }
          else { grossLoss += pnl; losses++; }
        } else {
          orphanSells++;   // SELL with no matching BUY today (carried position)
        }
      }
    });
    const total = wins + losses;

    // Headline Net P&L uses the same trade-derived number so all cards agree.
    document.getElementById('pnl').textContent = `₹${realizedNet.toFixed(2)}`;
    document.getElementById('pnl').className = 'value ' + (realizedNet >= 0 ? 'green' : 'red');

    document.getElementById('gross-profit').textContent = `₹+${grossProfit.toFixed(2)}`;
    document.getElementById('win-count').textContent = `${wins} winning trade${wins !== 1 ? 's' : ''}`;
    document.getElementById('gross-loss').textContent = `₹${grossLoss.toFixed(2)}`;
    document.getElementById('loss-count').textContent = `${losses} losing trade${losses !== 1 ? 's' : ''}`;
    document.getElementById('win-loss').textContent = `${wins}W / ${losses}L`;
    document.getElementById('win-loss').className = 'value ' + (wins > losses ? 'green' : wins < losses ? 'red' : 'gray');
    document.getElementById('trade-count').textContent =
      `${total} trade${total !== 1 ? 's' : ''} today` + (orphanSells ? ` · ${orphanSells} unmatched sell${orphanSells !== 1 ? 's' : ''}` : '');

    const tbody = document.getElementById('trades-body');
    tbody.innerHTML = '';
    trades.slice().reverse().forEach(t => {
      const tr = document.createElement('tr');
      const conf = t.confidence ? `<span class="conf">${parseFloat(t.confidence).toFixed(2)}</span>` : '—';
      const reason = (t.reason || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const actionColor = t.action === 'BUY' ? 'green' : t.action === 'SELL' ? (t.reason && t.reason.includes('stop-loss') ? 'red' : 'green') : '';
      tr.innerHTML = `<td>${t.timestamp}</td><td class="${actionColor}">${t.action}</td><td>${t.coin||t.stock||'—'}</td><td>₹${parseFloat(t.price||0).toFixed(2)}</td><td>${conf}</td><td class="reason-cell">${reason}</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('status').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    document.getElementById('status').textContent = `Error: ${e.message}`;
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
